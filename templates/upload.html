{% extends "base.html" %}
{% block title %}Upload - Nodebook{% endblock %}
{% block content %}
<div class="page-narrow">
  <h1>Upload images</h1>
  <p class="muted">PNG files saved by ComfyUI carry the full workflow in the file itself - drop them in and everything gets read out automatically.</p>

  <form method="post" enctype="multipart/form-data" id="upload-form">
    <label class="dropzone" id="dropzone" for="file-input">
      <span id="dropzone-label">Drag PNGs here, or click to choose files</span>
      <input type="file" id="file-input" name="images" accept=".png" multiple required>
    </label>
    <button type="submit" class="btn btn-primary">Upload</button>
  </form>
</div>
{% endblock %}

{% block scripts %}
<script>
const input = document.getElementById('file-input');
const zone = document.getElementById('dropzone');
const label = document.getElementById('dropzone-label');

input.addEventListener('change', () => {
  if (input.files.length) {
    label.textContent = input.files.length + ' file(s) selected';
  }
});

['dragover', 'dragleave', 'drop'].forEach(evt => {
  zone.addEventListener(evt, e => e.preventDefault());
});
zone.addEventListener('dragover', () => zone.classList.add('drag-active'));
zone.addEventListener('dragleave', () => zone.classList.remove('drag-active'));
zone.addEventListener('drop', e => {
  zone.classList.remove('drag-active');
  input.files = e.dataTransfer.files;
  label.textContent = input.files.length + ' file(s) selected';
});

// Capture each file's own last-modified time before submitting, so the
// server can sort by "when this was actually saved" separately from
// "when it reached Nodebook" - the browser's File API exposes this
// directly, no extra work needed on ComfyUI's end.
document.getElementById('upload-form').addEventListener('submit', () => {
  document.querySelectorAll('input[name="saved_at"]').forEach((el) => el.remove());
  Array.from(input.files).forEach((file) => {
    const hidden = document.createElement('input');
    hidden.type = 'hidden';
    hidden.name = 'saved_at';
    hidden.value = file.lastModified || '';
    document.getElementById('upload-form').appendChild(hidden);
  });
});
</script>
{% endblock %}
